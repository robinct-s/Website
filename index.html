<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stasis Sound</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="preload" href="assets/ui/logo-click.mp3" as="audio" type="audio/mpeg">
    <link rel="preload" href="assets/ui/logo-repulse.mp3" as="audio" type="audio/mpeg">
    <link rel="preload" href="assets/ui/dark-mode-on.mp3" as="audio" type="audio/mpeg">
    <link rel="preload" href="assets/ui/light-mode-on.mp3" as="audio" type="audio/mpeg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pre-intro">

    <!-- Navigation -->
    <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav-list" aria-label="Open menu">Menu</button>
    <nav aria-label="Primary">
        <ul id="site-nav-list">
            <li><a href="home.html" data-link="home">Home</a></li>
            <li><a href="works.html" data-link="works">Composition</a></li>
            <li><a href="live.html" data-link="live">Live</a></li>
            <li><a href="mixes.html" data-link="mixes">Radio</a></li>
            <li><a href="sound-design.html" data-link="sound-design">Sound Design</a></li>
            <li><a href="installation.html" data-link="installation">Installation</a></li>
            <li><a href="physicals.html" data-link="physicals">Physicals</a></li>
            <li><a href="label.html" data-link="label">Label</a></li>
            <li><a href="about.html" data-link="about">About</a></li>
            <li><a href="visitors.html" data-link="visitors">Visitors</a></li>
        </ul>
    </nav>
    <button class="dark-mode-toggle" id="dark-mode-toggle" type="button" aria-pressed="false" aria-label="Switch to echo mapping">
        <span class="dark-mode-toggle-orb" aria-hidden="true">
            <span class="dark-mode-toggle-glyph"></span>
        </span>
        <span class="dark-mode-toggle-label">active sight</span>
    </button>

    <!-- Background Layers -->
    <div class="texture-bg" aria-hidden="true"></div>
    <div id="particles-js" aria-hidden="true"></div>
    <div id="torch-field" aria-hidden="true">
        <span class="dark-mode-torch"></span>
    </div>
    <div id="darkness-field" aria-hidden="true"></div>
    <div id="aura-field" aria-hidden="true"></div>
    <button id="intro-logo-trigger" aria-label="Start audio and intro animation"></button>
    <p id="intro-open-note">audio up, explore deliberately</p>

    <!-- Center Hero Brand -->
    <div class="brand-hero" aria-label="Stasis Sound">
        <div class="logo">
            <span class="logo-word logo-word-left" aria-hidden="true">stasis</span>
            <span class="logo-mark" aria-hidden="true"></span>
            <span class="logo-word logo-word-right" aria-hidden="true">sound</span>
        </div>
    </div>
    <button id="home-logo-interact" aria-label="Pulse the logo"></button>

    <!-- Main Content -->
    <main id="content"></main>

<!-- Music Player -->
<div class="player">
    <button id="prev-track">⏮</button>
    <button id="play-pause">▶</button>
    <span id="track-title">Loading...</span>
    <button id="next-track">⏭</button>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.2">
</div>

<audio id="music-player" preload="auto"></audio>

    <!-- JS Libraries -->
    <script src="js/ambient-particles.js"></script>
    <script src="js/app.js"></script>
    <script src="js/visitors-config.js"></script>
    <script src="js/home-visitors.js"></script>
    <script src="js/releases-data.js"></script>
    <script src="js/works.js"></script>
    <script src="js/mixes-data.js"></script>
    <script src="js/mixes.js"></script>
    <script src="js/live-data.js"></script>
    <script src="js/live.js"></script>
    <script src="js/sound-design-data.js"></script>
    <script src="js/sound-design.js"></script>
    <script src="js/installation.js"></script>
    <script src="js/physicals-data.js"></script>
    <script src="js/physicals.js"></script>
    <script src="js/label-data.js"></script>
    <script src="js/label.js"></script>
    <script src="js/about-data.js"></script>
    <script src="js/about.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui-sounds.js"></script>
    <script src="js/dark-mode.js"></script>



</body>
</html>
